[package]
name = "admin"
version = "0.1.0"
authors = ["Franz Dietrich <dietrich@teilgedanken.de>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7" }
dioxus-bootstrap-css = "0.7"
dioxus-i18n = "0.6"
unic-langid = "0.9"
futures-util = "0.3"
spacetimedb-sdk = { version = "2.12" }
stalwart_mta_hook_types = { version = "0.1" }
hex = "0.4"
blake3 = "1.8"
gloo-timers = { version = "0.4", features = ["futures"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
urlencoding = "2.1"
regex = "1.13"
openidconnect = { version = "4", default-features = false, features = [
    "reqwest",
] }
base64 = "0.23"
mail-parser = "0.11"
htmd = "0.5"
pulldown-cmark = "0.13"
ammonia = "4"
url = "2"
web-sys = { version = "0.3", features = [
    "Window",
    "History",
    "Location",
    "Storage",
    "Navigator",
    "Clipboard",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
dotenvy = "0.15"
futures-channel = "0.3.34"

[target.'cfg(target_arch = "wasm32")'.dependencies]
spacetimedb-sdk = { version = "2.12", features = ["browser"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }
