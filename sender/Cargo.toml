[package]
name = "sender"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sender"
path = "src/main.rs"

[dependencies]
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1-rustls-tls",
    "hostname",
] }
serde = { version = "1.0", features = ["derive"] }
spacetimedb-sdk = { version = "2.10" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.32", features = [
    "rt-tokio",
    "trace",
    "logs",
] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = "0.32"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
regex = "1.13"
blake3 = "1"
hex = "0.4"
