[package]
name = "spacetime-module"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.14.1", features = [ "unstable" ] }
log = "0.4"
stalwart_mta_hook_types = { version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1"
hex = "0.4"
urlencoding = "2.1"
mail-parser = "1.0.1"
mail-builder = { path = "vendor/mail-builder", default-features = false }
base64 = "0.23"
regex = "1"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
