name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # Rust
      # ------------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install mdBook
        run: |
          cargo binstall mdbook --no-confirm
          mdbook --version

      - name: Install mdbook-d2
        run: |
          cargo binstall mdbook-d2 --no-confirm

      # ------------------------------------------------------------
      # D2 + TALA
      # ------------------------------------------------------------
      - name: Install D2 and TALA
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --tala

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

          d2 version
          d2 layout tala

      # ------------------------------------------------------------
      # Build mdBook
      # ------------------------------------------------------------
      - name: Build mdBook
        working-directory: docs
        run: |
          mdbook build

      - name: Verify Pages artifact contents
        working-directory: docs
        run: |
          echo "=== D2 directory ==="
          ls -lah book/d2

          echo
          echo "=== SVG count ==="
          find book/d2 -type f -name '*.svg' | wc -l

          echo
          echo "=== Example SVG ==="
          ls -lh book/d2/4.1.1.1.svg

          echo
          echo "=== All SVG files ==="
          find book -type f -name '*.svg' -print

      # ------------------------------------------------------------
      # GitHub Pages
      # ------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
