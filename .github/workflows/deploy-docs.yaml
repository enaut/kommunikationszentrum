name: Deploy mdBook with D2 & TALA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install mdBook Binary
        run: |
          MDBOOK_VERSION=$(curl -s https://github.com | jq -r '.tag_name')
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Install D2 CLI & TALA Engine
        run: |
          # Nutzt das offizielle Skript, um D2 zusammen mit dem TALA-Plugin im System zu installieren
          curl -fsSL https://d2lang.com | sh -s -- --tala
          
          # Verifizieren, dass TALA registriert ist
          d2 layout tala

      - name: Install mdbook-d2 preprocessor
        run: |
          # Lädt die neueste Linux-Version des mdbook-d2 Preprocessors direkt von GitHub herunter
          D2_PLUGIN_VERSION=$(curl -s https://github.com | jq -r '.tag_name')
          curl -sSL "https://github.com{D2_PLUGIN_VERSION}/mdbook-d2-${D2_PLUGIN_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook-d2 /usr/local/bin/

      - name: Build mdBook
        run: |
          cd docs
          mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
